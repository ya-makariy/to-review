name: ToReview
options:
  bundleIdPrefix: com.ya-makariy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # No paid developer account: ad-hoc signing everywhere.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  ToReviewCore:
    path: Packages/ToReviewCore

targets:
  ToReview:
    type: application
    platform: macOS
    sources:
      - path: ToReview
        excludes: ["Resources/Info.plist"]
    dependencies:
      - package: ToReviewCore
      - target: ToReviewWidget
        embed: true
    info:
      path: ToReview/Resources/Info.plist
      properties:
        CFBundleName: ToReview
        CFBundleDisplayName: ToReview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Makarii Balashov. MIT License."
        NSUserNotificationsUsageDescription: "ToReview notifies you when a new pull request is waiting for your review."
    entitlements:
      path: ToReview/Resources/ToReview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Shared with the widget. An App Group would need a provisioning profile,
        # which ad-hoc signing cannot provide; see SharedStorage.swift.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/ToReview/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ya-makariy.toreview
        PRODUCT_NAME: ToReview
        # Ad-hoc signatures get a per-build cdhash designated requirement, which makes the
        # Keychain treat every rebuild as a different app. Pin the requirement to the bundle
        # id so stored tokens stay accessible across versions.
        OTHER_CODE_SIGN_FLAGS: -r='designated => identifier "com.ya-makariy.toreview"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    scheme:
      testTargets: []

  ToReviewWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: ToReviewWidget
        excludes: ["Info.plist"]
    dependencies:
      - package: ToReviewCore
    info:
      path: ToReviewWidget/Info.plist
      properties:
        CFBundleName: ToReviewWidget
        CFBundleDisplayName: ToReview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ToReviewWidget/ToReviewWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/ToReview/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ya-makariy.toreview.widget
        PRODUCT_NAME: ToReviewWidget
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]

schemes:
  ToReview:
    build:
      targets:
        ToReview: all
        ToReviewWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
